[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calogen"
version = "0.1.0"
description = "Model-agnostic generative calorimetry: training, NCE classifiers, Monte-Carlo resampling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "freia>=0.2",
    "h5py>=3.11.0",
    "jsonargparse[signatures]>=4.48.0",
    "jupyter>=1.1.1",
    "lightning==2.6.1",
    "matplotlib>=3.7.5",
    "normflows>=1.7.3",
    "numpy",
    "pandas>=2.0.3",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.3.2",
    "scipy>=1.10.1",
    "torch==2.10.0",
    "torchmetrics>=1.0",
    "tqdm",
    "wandb>=0.24.2",
    "seaborn"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The `calogen` package is installed (editable) via `uv sync`.
testpaths = ["tests"]

[tool.setuptools]
# `calogen` is an alias for the `src/` source directory.
package-dir = { "calogen" = "src" }
